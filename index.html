<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroTV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="room">
    <div class="setup">

      <div class="tv" id="tv">
        <div class="bezel">
          <div class="screen">
            <div id="yt-player"></div>
            <canvas id="static-canvas" width="200" height="150"></canvas>
            <div id="vcr-osd" class="vcr-osd" aria-hidden="true"></div>
            <div class="crt-overlay"></div>
            <div id="guide" class="guide"></div>
            <div id="channels" class="guide"></div>
            <div id="screen-off" class="screen-off covering"></div>
          </div>
        </div>

        <div class="front-panel">
          <button type="button" class="led-window" data-action="channels" title="Channel list"
                  aria-label="Channel list"><span id="led" class="led"></span></button>
          <!-- 2x3 block: each column is a pair, which frees the width the tape slot needs -->
          <div class="panel-buttons">
            <button class="tv-btn" data-action="ch-down"
                    data-title-tv="Channel down" data-title-tape="Rewind 30 seconds"
                    title="Channel down"><span class="lbl-tv">CH &minus;</span>
              <span class="lbl-tape" aria-hidden="true"><svg class="ico-t" viewBox="0 0 24 16"
                ><path d="M11 2 2 8l9 6z"/><path d="M21 2l-9 6 9 6z"/></svg></span></button>
            <button class="tv-btn" data-action="vol-down" title="Volume down">VOL &minus;</button>
            <button class="tv-btn" data-action="guide"
                    data-title-tv="Programme guide" data-title-tape="Play / pause"
                    title="Programme guide"><span class="lbl-tv">GUIDE</span>
              <span class="lbl-tape" aria-hidden="true"><svg class="ico-t" viewBox="0 0 24 16"
                ><path d="M3 2l9 6-9 6z"/><rect x="14.5" y="2" width="3.5" height="12"/><rect
                  x="20" y="2" width="3.5" height="12"/></svg></span></button>
            <button class="tv-btn" data-action="ch-up"
                    data-title-tv="Channel up" data-title-tape="Forward 30 seconds"
                    title="Channel up"><span class="lbl-tv">CH +</span>
              <span class="lbl-tape" aria-hidden="true"><svg class="ico-t" viewBox="0 0 24 16"
                ><path d="M3 2l9 6-9 6z"/><path d="M13 2l9 6-9 6z"/></svg></span></button>
            <button class="tv-btn" data-action="vol-up" title="Volume up">VOL +</button>
            <button class="tv-btn" data-action="cinema" title="Cinema mode (C)" aria-pressed="false">CINEMA</button>
          </div>
          <!-- the deck face: carries the brand the way a real combi unit did -->
          <button type="button" id="vhs-slot" class="vhs-slot" data-action="vhs"
                  title="Video library" aria-label="Video library">
            <span class="slot-brand">TELSTAR</span>
            <span class="slot-tape" aria-hidden="true"></span>
            <span class="slot-vhs">VHS</span>
          </button>
          <div class="power-cluster">
            <span id="power-light" class="power-light"></span>
            <button class="tv-btn power" data-action="power" title="Power" aria-label="Power">
              <svg class="ico-power" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 3.6v8.2"/><path d="M7.1 6.5a7 7 0 1 0 9.8 0"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="feet" aria-hidden="true"><span></span><span></span></div>
      </div>

      <div class="remote" aria-label="Remote control">
        <div class="remote-top">
          <span class="remote-ir"></span>
          <button class="r-btn r-power" data-action="power" title="Power" aria-label="Power">
            <svg class="ico-power" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 3.6v8.2"/><path d="M7.1 6.5a7 7 0 1 0 9.8 0"/>
            </svg>
          </button>
        </div>
        <div class="remote-digits">
          <button class="r-btn" data-action="digit" data-value="1">1</button>
          <button class="r-btn" data-action="digit" data-value="2">2</button>
          <button class="r-btn" data-action="digit" data-value="3">3</button>
          <button class="r-btn" data-action="digit" data-value="4">4</button>
          <button class="r-btn" data-action="digit" data-value="5">5</button>
          <button class="r-btn" data-action="digit" data-value="6">6</button>
          <button class="r-btn" data-action="digit" data-value="7">7</button>
          <button class="r-btn" data-action="digit" data-value="8">8</button>
          <button class="r-btn" data-action="digit" data-value="9">9</button>
          <button class="r-btn" data-action="mute" title="Mute">&#128263;</button>
          <button class="r-btn" data-action="digit" data-value="0">0</button>
          <button class="r-btn" data-action="guide" title="Guide">&#9776;</button>
        </div>
        <div class="remote-rockers">
          <div class="rocker">
            <button class="r-btn" data-action="ch-up" title="Channel up">&#9650;</button>
            <span class="rocker-label">CH</span>
            <button class="r-btn" data-action="ch-down" title="Channel down">&#9660;</button>
          </div>
          <div class="rocker">
            <button class="r-btn" data-action="vol-up" title="Volume up">&#9650;</button>
            <span class="rocker-label">VOL</span>
            <button class="r-btn" data-action="vol-down" title="Volume down">&#9660;</button>
          </div>
        </div>
        <button class="r-btn r-cinema" data-action="cinema" title="Cinema mode (C)" aria-pressed="false">CINEMA</button>
        <span class="remote-brand">TELSTAR</span>
      </div>

    </div>
    <div id="shelf" class="shelf" hidden aria-label="Video library"></div>
    <p class="hint">P power &nbsp; &uarr;&darr; channel &nbsp; &larr;&rarr; volume &nbsp; 0&ndash;9 direct &nbsp; M mute &nbsp; G guide &nbsp; C cinema &nbsp; V video</p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
